<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f3ed" />
    <meta
      name="description"
      content="Play Dots and Boxes against an experimental graph agent."
    />
    <title>Alpha Dots &amp; Boxes</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="Alpha Dots and Boxes home">
        <span class="logo" aria-hidden="true">▦</span> alpha
        <span class="wordmark-light">/ dots &amp; boxes</span>
      </a>
      <div class="header-actions">
        <span class="agent-label" id="agent-description">Loading…</span>
        <details class="rules-help">
          <summary>Rules</summary>
          <p>
            Draw a line between neighboring dots. Closing a box earns a point
            and another turn. Most boxes wins.
          </p>
        </details>
      </div>
    </header>
    <main>
      <section class="play-layout" aria-label="Game">
        <aside class="controls panel">
          <h2 class="panel-heading">Game</h2>
          <div class="field-label">Board size <span>boxes</span></div>
          <div class="presets" role="group" aria-label="Board size">
            <button data-size="2" type="button" aria-pressed="false">
              2 × 2
            </button>
            <button
              data-size="3"
              type="button"
              class="selected"
              aria-pressed="true"
            >
              3 × 3
            </button>
            <button data-size="4" type="button" aria-pressed="false">
              4 × 4
            </button>
            <button data-size="5" type="button" aria-pressed="false">
              5 × 5
            </button>
          </div>
          <details class="custom-size">
            <summary>Custom size</summary>
            <div class="dimension-fields">
              <label
                >Rows<input id="rows" type="number" min="1" max="12" value="3"
              /></label>
              <span>×</span>
              <label
                >Columns<input
                  id="cols"
                  type="number"
                  min="1"
                  max="12"
                  value="3"
              /></label>
            </div>
          </details>
          <div class="setting-field">
            <label class="field-label" for="budget">Thinking time</label>
            <select id="budget">
              <option value="32">Quick</option>
              <option value="128" selected>Standard</option>
              <option value="512">Deep</option>
            </select>
          </div>
          <div class="setting-field">
            <label class="field-label" for="pace">Move delay</label>
            <select id="pace">
              <option value="500">0.5 seconds</option>
              <option value="1000" selected>1 second</option>
              <option value="2000">2 seconds</option>
            </select>
          </div>
          <div class="setting-field seat-field" id="seat-controls">
            <label class="field-label" for="seat">First move</label>
            <select id="seat">
              <option value="0">You</option>
              <option value="1">Agent</option>
            </select>
          </div>
        </aside>
        <div class="game-panel panel">
          <div class="game-top">
            <div>
              <span class="eyebrow" id="board-label">3 × 3 boxes</span>
              <h2 id="turn-title">Your move.</h2>
            </div>
            <div class="game-options">
              <select id="mode" aria-label="Players" title="Players">
                <option value="play">You vs Agent</option>
                <option value="watch">Agent vs Agent</option>
              </select>
              <div class="live-pill" id="live-pill">
                <i></i><span>READY</span>
              </div>
            </div>
          </div>
          <div class="board-wrap">
            <svg
              id="board"
              viewBox="0 0 400 400"
              role="group"
              aria-label="Dots and Boxes board"
            ></svg>
          </div>
          <div class="board-bottom">
            <p id="status" aria-live="polite"></p>
            <div class="board-actions">
              <span id="watch-controls" hidden>
                <button id="watch" type="button" class="watch-button">
                  <span aria-hidden="true">Ⅱ</span> Pause
                </button>
              </span>
              <button id="hint" type="button">Hint</button>
              <button id="undo" type="button" disabled>Undo</button>
              <button id="new-game" type="button" class="primary">
                New game
              </button>
            </div>
          </div>
        </div>
        <aside class="score-column" aria-label="Score">
          <div class="score-card human-card">
            <div class="score-top">
              <span class="player-dot human-dot"></span>
              <span id="human-label">YOU</span>
              <span id="human-turn" class="turn-indicator">YOUR TURN</span>
            </div>
            <div class="score-number" id="human-score">0</div>
            <div class="score-track"><span id="human-track"></span></div>
          </div>
          <div class="score-card agent-card">
            <div class="score-top">
              <span class="player-dot agent-dot"></span>
              <span id="agent-label">AGENT</span>
              <span id="agent-turn" class="turn-indicator" hidden
                >THINKING</span
              >
            </div>
            <div class="score-number" id="agent-score">0</div>
            <div class="score-track"><span id="agent-track"></span></div>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
