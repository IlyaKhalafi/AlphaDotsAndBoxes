[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-dots-and-boxes"
version = "0.1.0"
description = "A board-size independent graph agent that learns Dots and Boxes through self-play."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
train = ["torch>=2.5,<3", "ray[rllib]==2.58.0"]
dev = ["alpha-dots-and-boxes[train]", "pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]
media = ["playwright>=1.55,<2", "pillow>=11,<13", "httpx>=0.28,<1"]
analysis = ["matplotlib>=3.9,<4"]

[project.scripts]
adb = "alphaboxes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alphaboxes = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
